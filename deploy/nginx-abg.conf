# Прод-конфиг abg.hiborg-space.ru.
#
# Источник истины — VPS: /etc/nginx/sites-available/abg (certbot правит этот файл сам).
# Эта копия в репозитории существует, чтобы правки заголовков и белого списка
# frame-ancestors проходили ревью, а не жили только на сервере. При расхождении —
# прав сервер; после правки на сервере обновите копию.
#
# Проверка: nginx -t && systemctl reload nginx
# Заголовки: curl -sSI https://abg.hiborg-space.ru/index.html

server {
    include /etc/nginx/snippets/block-scan.conf;
    server_name abg.hiborg-space.ru;

    root /var/www/abg;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff;
    }

    # index.html не кэшируется: после деплоя клиент сразу получает новую версию,
    # а не залипает на старой из кэша (у /assets/ хеш в имени — их можно кэшировать).
    # ВНИМАНИЕ: add_header в location не наследует заголовки предыдущего уровня,
    # поэтому nosniff продублирован осознанно.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff;
        # Кто имеет право встраивать виджет в iframe. Новый домен заказчика —
        # дописать сюда (иначе браузер покажет в iframe пустоту).
        add_header Content-Security-Policy "frame-ancestors 'self' https://abgtz.com https://*.abgtz.com https://hiborg-space.ru https://*.hiborg-space.ru";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Приём заявок виджета: см. docs/leads-channel.md
    location /api/ {
        proxy_pass http://127.0.0.1:8862/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/abg.access.log;
    error_log  /var/log/nginx/abg.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/abg.hiborg-space.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/abg.hiborg-space.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = abg.hiborg-space.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name abg.hiborg-space.ru;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}
